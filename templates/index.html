<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Risk StressLab</title>
  <script src="/static/vendor/plotly.js"></script>
  <script src="/static/vendor/react.js"></script>
  <script src="/static/vendor/react-dom.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #fafafa; color: #111827;
      overflow-x: hidden;
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 0; width: 100vw; height: 100vh; }
    .bg-overlay {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 20%,
        rgba(250,250,250,0.1) 0%, rgba(250,250,250,0.55) 50%, #fafafa 85%);
    }

    #root { position: relative; z-index: 2; }

    .shell {
      max-width: 1240px; margin: 0 auto; padding: 48px 24px 80px;
    }
    .header { text-align: center; margin-bottom: 36px; }
    .header .logo {
      display: inline-flex; align-items: center; gap: 10px;
    }
    .logo-dot {
      width: 12px; height: 12px; border-radius: 50%; background: #111827;
      box-shadow: 0 0 0 4px rgba(17,24,39,.08);
    }
    .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .header p { color: #6b7280; font-size: .9rem; margin-top: 6px; }

    .columns {
      display: grid; grid-template-columns: 420px 1fr; gap: 24px;
      align-items: start;
    }
    @media (max-width: 980px) { .columns { grid-template-columns: 1fr; }
      .form-card { position: static; } }

    /* Form stays in view while scrolling the results column */
    .form-card { position: sticky; top: 24px; }

    /* Decision + gauge share one row */
    .decision-card { display: flex; align-items: center; gap: 14px; padding: 20px 24px; margin-bottom: 18px; }
    .decision-card .decision { flex: 1; margin-bottom: 0; }
    .decision-card > div:last-child { flex: 1.1; min-width: 0; }

    /* Waterfall and drivers side by side */
    .charts-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; }
    @media (max-width: 1250px) { .charts-grid { grid-template-columns: 1fr; } }

    .card {
      background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
      border: 1px solid #e5e7eb; border-radius: 18px; padding: 28px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(17,24,39,.06);
    }
    .card h2 { font-size: .8rem; font-weight: 700; color: #374151;
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 18px; }

    label {
      display: block; font-size: .68rem; font-weight: 600; color: #6b7280;
      text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 5px;
    }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #d1d5db; background: #fff; color: #111827;
      font-size: .92rem; transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus {
      outline: none; border-color: #111827; box-shadow: 0 0 0 3px rgba(17,24,39,.08);
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: #e5e7eb;
      outline: none;
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
      transition: background 0.15s ease;
    }
    input[type="range"]:focus {
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #111827;
      cursor: pointer;
      border: none !important;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.35);
      background-color: #374151;
    }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    button.primary {
      margin-top: 24px; width: 100%; padding: 13px; border: none;
      border-radius: 10px; background: #111827; color: #fff;
      font-size: .95rem; font-weight: 600; cursor: pointer;
      transition: background .15s, transform .1s;
    }
    button.primary:hover { background: #000; }
    button.primary:disabled { background: #9ca3af; cursor: not-allowed; }

    .placeholder {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 420px; color: #9ca3af; text-align: center; gap: 12px;
    }
    .placeholder .icon { font-size: 2.6rem; opacity: .55; }
    .placeholder p { font-size: .9rem; max-width: 320px; line-height: 1.55; }

    .decision {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 22px; border-radius: 14px; border: 1px solid #e5e7eb;
      margin-bottom: 18px;
    }
    .decision.approve { background: #f0fdf4; border-color: #bbf7d0; }
    .decision.reject  { background: #fef2f2; border-color: #fecaca; }
    .decision .verdict { font-size: 1.25rem; font-weight: 700; letter-spacing: .03em; }
    .decision.approve .verdict { color: #15803d; }
    .decision.reject  .verdict { color: #b91c1c; }
    .decision .prob-big { font-size: 1.6rem; font-weight: 700; }
    .decision.approve .prob-big { color: #15803d; }
    .decision.reject  .prob-big { color: #b91c1c; }
    .decision .prob-label { font-size: .68rem; color: #6b7280; text-align: right;
      text-transform: uppercase; letter-spacing: .05em; }

    .ai-box {
      padding: 16px 18px; border-radius: 0 12px 12px 0;
      background: #eff6ff; border-left: 3px solid #2563eb; margin-bottom: 18px;
    }
    .ai-box .ai-label {
      font-size: .66rem; font-weight: 700; color: #2563eb;
      text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px;
    }
    .ai-box .ai-text { font-style: italic; font-size: .88rem; color: #374151; line-height: 1.55; }
    .ai-box .ai-text.loading { color: #93c5fd; }

    .chart-block { background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
      border: 1px solid #e5e7eb; border-radius: 18px; padding: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(17,24,39,.06);
      margin-bottom: 18px; }
    .chart-block h3 { font-size: .95rem; font-weight: 600; margin-bottom: 2px; }
    .chart-block .hint { font-size: .72rem; color: #9ca3af; margin-bottom: 10px; }

    .driver-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .driver {
      display: flex; align-items: center; gap: 10px;
      font-size: .8rem; color: #374151;
    }
    .driver .name { flex: 0 0 205px; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; }
    .driver .bar-wrap { flex: 1; height: 8px; background: #f3f4f6;
      border-radius: 4px; overflow: hidden; display: flex; }
    .driver .bar-pos { background: #ef4444; height: 100%; border-radius: 0 4px 4px 0;
      animation: growBar .7s cubic-bezier(.2,.8,.3,1); transform-origin: left; }
    .driver .bar-neg { background: #22c55e; height: 100%; border-radius: 4px 0 0 4px;
      animation: growBar .7s cubic-bezier(.2,.8,.3,1); transform-origin: left; }
    @keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .driver .arrow { width: 14px; text-align: center; font-weight: 700; }
    .driver .arrow.up { color: #ef4444; }
    .driver .arrow.down { color: #22c55e; }

    .error {
      margin-top: 16px; padding: 11px 14px; border-radius: 10px;
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
      font-size: .875rem;
    }

    .spinner {
      width: 18px; height: 18px; border: 2.5px solid #d1d5db;
      border-top-color: #111827; border-radius: 50%;
      animation: spin .7s linear infinite; display: inline-block; vertical-align: -4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { text-align: center; margin-top: 40px; font-size: .7rem; color: #9ca3af;
      letter-spacing: .03em; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-overlay"></div>
  <div id="root"></div>

  <script>
    /* ================= Cursor-reactive background =================
       A network of drifting "risk nodes" with connecting lines that
       react to the cursor: nearby particles are repelled and their
       links light up blue (risk lighting up under inspection). */
    (function () {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, mouse = { x: -9999, y: -9999 };
      const N = 70, LINK_DIST = 130, MOUSE_DIST = 160;
      let particles = [];

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function makeParticle() {
        return {
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
          r: 1.2 + Math.random() * 1.8
        };
      }
      for (let i = 0; i < N; i++) particles.push(makeParticle());

      window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
      window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

      function draw() {
        ctx.clearRect(0, 0, W, H);

        for (const p of particles) {
          // gentle drift
          p.x += p.vx; p.y += p.vy;
          if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
          if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;

          // cursor repulsion
          const dx = p.x - mouse.x, dy = p.y - mouse.y;
          const d = Math.hypot(dx, dy);
          if (d < MOUSE_DIST && d > 0.01) {
            const force = (MOUSE_DIST - d) / MOUSE_DIST * 0.6;
            p.x += (dx / d) * force;
            p.y += (dy / d) * force;
          }
        }

        // links
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i], b = particles[j];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            if (d < LINK_DIST) {
              const nearMouse = Math.hypot((a.x + b.x) / 2 - mouse.x, (a.y + b.y) / 2 - mouse.y) < MOUSE_DIST;
              const alpha = (1 - d / LINK_DIST) * (nearMouse ? 0.35 : 0.09);
              ctx.strokeStyle = nearMouse ? 'rgba(37, 99, 235,' + alpha + ')'
                                          : 'rgba(17, 24, 39,' + alpha + ')';
              ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
          }
        }

        // nodes
        for (const p of particles) {
          const d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
          const hot = d < MOUSE_DIST;
          ctx.beginPath();
          ctx.arc(p.x, p.y, hot ? p.r * 1.5 : p.r, 0, Math.PI * 2);
          ctx.fillStyle = hot ? 'rgba(37, 99, 235, .5)' : 'rgba(17, 24, 39, .16)';
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
